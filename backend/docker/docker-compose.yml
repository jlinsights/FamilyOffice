version: '3.8'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: familyoffice-postgres
    environment:
      POSTGRES_DB: familyoffice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - familyoffice-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: familyoffice-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - familyoffice-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  # 포트폴리오 서비스
  portfolio-service:
    build:
      context: ../services/portfolio-service
      dockerfile: Dockerfile
    container_name: familyoffice-portfolio-service
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: familyoffice
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: debug
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - familyoffice-network
    volumes:
      - ../services/portfolio-service:/app
      - /app/node_modules

  # 트랜잭션 서비스
  transaction-service:
    build:
      context: ../services/transaction-service
      dockerfile: Dockerfile
    container_name: familyoffice-transaction-service
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: familyoffice
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: debug
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - familyoffice-network
    volumes:
      - ../services/transaction-service:/app
      - /app/node_modules

  # 리포팅 서비스
  reporting-service:
    build:
      context: ../services/reporting-service
      dockerfile: Dockerfile
    container_name: familyoffice-reporting-service
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: familyoffice
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: debug
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - familyoffice-network
    volumes:
      - ../services/reporting-service:/app
      - /app/node_modules

  # 사용자 관리 서비스
  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: familyoffice-user-service
    environment:
      NODE_ENV: development
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: familyoffice
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: debug
    ports:
      - '3004:3004'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - familyoffice-network
    volumes:
      - ../services/user-service:/app
      - /app/node_modules

  # 통합 허브 서비스
  integration-hub:
    build:
      context: ../services/integration-hub
      dockerfile: Dockerfile
    container_name: familyoffice-integration-hub
    environment:
      NODE_ENV: development
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: familyoffice
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: debug
    ports:
      - '3005:3005'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - familyoffice-network
    volumes:
      - ../services/integration-hub:/app
      - /app/node_modules

  # API 게이트웨이 (Nginx)
  api-gateway:
    image: nginx:alpine
    container_name: familyoffice-api-gateway
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - portfolio-service
      - transaction-service
      - reporting-service
      - user-service
      - integration-hub
    networks:
      - familyoffice-network

  # Prometheus 모니터링
  prometheus:
    image: prom/prometheus:latest
    container_name: familyoffice-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - familyoffice-network

  # Grafana 대시보드
  grafana:
    image: grafana/grafana:latest
    container_name: familyoffice-grafana
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - familyoffice-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  familyoffice-network:
    driver: bridge
