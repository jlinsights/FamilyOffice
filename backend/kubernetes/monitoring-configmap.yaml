apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: familyoffice
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "alert_rules.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      - job_name: 'portfolio-service'
        static_configs:
          - targets: ['portfolio-service:3001']
        metrics_path: /metrics
        scrape_interval: 15s

      - job_name: 'transaction-service'
        static_configs:
          - targets: ['transaction-service:3002']
        metrics_path: /metrics
        scrape_interval: 15s

      - job_name: 'reporting-service'
        static_configs:
          - targets: ['reporting-service:3003']
        metrics_path: /metrics
        scrape_interval: 15s

      - job_name: 'user-service'
        static_configs:
          - targets: ['user-service:3004']
        metrics_path: /metrics
        scrape_interval: 15s

      - job_name: 'integration-hub'
        static_configs:
          - targets: ['integration-hub:3005']
        metrics_path: /metrics
        scrape_interval: 15s

  alert_rules.yml: |
    groups:
      - name: familyoffice-alerts
        rules:
          - alert: HighCPUUsage
            expr: container_cpu_usage_seconds_total{container="portfolio-service"} > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "Container {{ $labels.container }} has high CPU usage"

          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{container="portfolio-service"} > 1e9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Container {{ $labels.container }} has high memory usage"

          - alert: ServiceDown
            expr: up{job="portfolio-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service is down"
              description: "Service {{ $labels.job }} is not responding"

          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value }} errors per second"
