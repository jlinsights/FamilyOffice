# Enhanced CI/CD Pipeline for FamilyOffice
# Optimized for speed, reliability, and financial platform requirements

name: FamilyOffice Enhanced CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # Fast preliminary checks
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: TypeScript check
        run: pnpm type-check

      - name: Lint check
        run: pnpm lint

      - name: Format check  
        run: pnpm format:check

  # Security and dependency analysis
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level moderate

      - name: Check for sensitive data
        run: |
          # Check for potential secrets in code
          if grep -r "sk_test\|pk_test\|AKIA\|secret" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "❌ Potential secrets found in code"
            exit 1
          fi
          echo "✅ No obvious secrets detected"

  # Unit and integration tests
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quick-checks
    strategy:
      matrix:
        test-type: [unit, integration, security]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.test-type }} tests
        run: pnpm test:${{ matrix.test-type }}
        env:
          CI: true

      - name: Upload coverage
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info

  # E2E tests with Playwright
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quick-checks
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
        viewport: [desktop, mobile]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.browser }}-${{ matrix.viewport }}
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.viewport }}
          path: playwright-report/
          retention-days: 7

  # Performance testing
  performance-tests:
    name: Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-suite
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          ANALYZE: true

      - name: Performance budget check
        run: |
          # Check bundle size limits for financial platform
          MAIN_JS_SIZE=$(stat -c%s .next/static/chunks/pages/_app-*.js | head -1)
          MAX_SIZE=350000  # 350KB limit for main bundle
          
          if [ $MAIN_JS_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Main bundle size ($MAIN_JS_SIZE bytes) exceeds limit ($MAX_SIZE bytes)"
            exit 1
          fi
          echo "✅ Bundle size within limits: $MAIN_JS_SIZE bytes"

      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Performance regression check
        run: pnpm test:performance
        continue-on-error: true

  # Build verification
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security-scan, test-suite]
    strategy:
      matrix:
        environment: [production, staging]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for ${{ matrix.environment }}
        run: pnpm vercel-build
        env:
          NODE_ENV: ${{ matrix.environment }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify build outputs
        run: |
          # Check for essential files
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "❌ Build ID not found"
            exit 1
          fi
          
          if [ ! -d ".next/static" ]; then
            echo "❌ Static assets not generated"
            exit 1
          fi
          
          echo "✅ Build verification passed"

      - name: Upload build artifacts
        if: matrix.environment == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: .next/
          retention-days: 1

  # Deployment readiness
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-verification, e2e-tests, performance-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Environment validation
        run: |
          # Validate required environment variables are set
          REQUIRED_VARS="NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY NEXT_PUBLIC_SUPABASE_URL"
          
          for var in $REQUIRED_VARS; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required environment variable: $var"
              exit 1
            fi
          done
          
          echo "✅ All required environment variables present"

      - name: Database connectivity check
        run: |
          # Test Supabase connectivity
          curl -f "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" || {
            echo "❌ Database connectivity failed"
            exit 1
          }
          echo "✅ Database connectivity verified"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Third-party service checks
        run: |
          # Check Clerk status
          curl -f "https://api.clerk.com/v1/health" || {
            echo "⚠️ Clerk service may be experiencing issues"
          }
          
          # Check Cal.com availability
          curl -f "https://cal.com/api/health" || {
            echo "⚠️ Cal.com service may be experiencing issues"  
          }
          
          echo "✅ Third-party service checks completed"

  # Slack notification
  notify:
    name: Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [deployment-check]
    steps:
      - name: Slack notification
        if: github.ref == 'refs/heads/main'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#familyoffice-deployments'
          text: |
            🚀 FamilyOffice Pipeline: ${{ job.status }}
            📝 Commit: ${{ github.event.head_commit.message }}
            👤 Author: ${{ github.actor }}
            🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

# Additional optimizations:
# - Uses pnpm for faster dependency installation
# - Parallel job execution where possible
# - Specific timeouts to prevent hanging jobs
# - Matrix strategy for comprehensive browser testing
# - Artifact uploads for debugging failed tests
# - Performance budgets and monitoring
# - Security scanning with Trivy
# - Build verification for multiple environments
# - Deployment readiness checks
# - Slack notifications for team awareness