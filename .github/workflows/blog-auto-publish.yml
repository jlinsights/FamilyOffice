name: 블로그 콘텐츠 자동 발행

on:
  schedule:
    # 화요일 오후 2:30 (UTC+9 = UTC+0 05:30)
    - cron: '30 5 * * 2'
    # 목요일 저녁 8:00 (UTC+9 = UTC+0 11:00)
    - cron: '0 11 * * 4'
  workflow_dispatch:
    inputs:
      publish_type:
        description: '발행할 콘텐츠 타입'
        required: true
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - tuesday-only
          - thursday-only
          - emergency
      force_publish:
        description: '강제 발행 (승인 없이 발행)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  REVIEWER_EMAIL: 'jhlim725@gmail.com'
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  check-approval:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.approval-check.outputs.approved }}
      content_ready: ${{ steps.content-check.outputs.ready }}
      publish_type: ${{ steps.schedule-check.outputs.type }}

    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📅 Check Schedule & Content Type
        id: schedule-check
        run: |
          CURRENT_DAY=$(date +%u)  # 1=Monday, 2=Tuesday, 4=Thursday
          CURRENT_HOUR=$(date +%H)

          if [[ "${{ github.event.inputs.publish_type }}" == "tuesday-only" ]] || [[ $CURRENT_DAY == 2 && $CURRENT_HOUR == 14 ]]; then
            echo "type=tuesday" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.publish_type }}" == "thursday-only" ]] || [[ $CURRENT_DAY == 4 && $CURRENT_HOUR == 20 ]]; then
            echo "type=thursday" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.publish_type }}" == "emergency" ]]; then
            echo "type=emergency" >> $GITHUB_OUTPUT
          else
            echo "type=none" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Check for Approved Content
        id: content-check
        run: |
          # 승인된 PR에서 ready-to-publish 라벨 확인
          CURRENT_WEEK=$(date +%V)

          # GitHub API로 승인된 PR 찾기
          APPROVED_PRS=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&head=blog/week-$CURRENT_WEEK-auto-generated" | \
            jq -r '.[] | select(.labels[]?.name == "ready-to-publish") | .number')
            
          if [[ -n "$APPROVED_PRS" ]]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "pr_number=$APPROVED_PRS" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: ✅ Approval Status Check
        id: approval-check
        run: |
          FORCE_PUBLISH="${{ github.event.inputs.force_publish }}"
          CONTENT_READY="${{ steps.content-check.outputs.ready }}"
          PUBLISH_TYPE="${{ steps.schedule-check.outputs.type }}"

          if [[ "$FORCE_PUBLISH" == "true" ]] || [[ "$CONTENT_READY" == "true" && "$PUBLISH_TYPE" != "none" ]]; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "✅ 발행 승인됨: Force=$FORCE_PUBLISH, Ready=$CONTENT_READY, Type=$PUBLISH_TYPE"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "❌ 발행 조건 미충족: Force=$FORCE_PUBLISH, Ready=$CONTENT_READY, Type=$PUBLISH_TYPE"
          fi

  publish-content:
    needs: check-approval
    if: needs.check-approval.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔄 Merge Approved Content
        if: needs.check-approval.outputs.content_ready == 'true'
        run: |
          PR_NUMBER="${{ needs.check-approval.outputs.pr_number }}"

          # PR 정보 가져오기
          PR_INFO=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")
            
          BRANCH_NAME=$(echo "$PR_INFO" | jq -r '.head.ref')

          # 브랜치 체크아웃 및 병합
          git checkout main
          git pull origin main
          git checkout "$BRANCH_NAME"
          git checkout main
          git merge --no-ff "$BRANCH_NAME" -m "🚀 Auto-publish blog content from PR #$PR_NUMBER"

          echo "merged_branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: 📝 Process Draft Content
        id: process-content
        run: |
          PUBLISH_TYPE="${{ needs.check-approval.outputs.publish_type }}"
          CURRENT_DATE=$(date +%Y-%m-%d)
          CURRENT_DAY=$(date +%A)

          # Draft 폴더에서 콘텐츠 확인
          if [[ -d "lib/blog-drafts" ]]; then
            DRAFT_FILES=$(ls lib/blog-drafts/*.md 2>/dev/null || echo "")
            
            for draft_file in $DRAFT_FILES; do
              if [[ "$PUBLISH_TYPE" == "tuesday" && "$draft_file" == *"tuesday"* ]] || \
                 [[ "$PUBLISH_TYPE" == "thursday" && "$draft_file" == *"thursday"* ]] || \
                 [[ "$PUBLISH_TYPE" == "emergency" ]]; then
                
                # Draft를 실제 블로그 데이터로 변환
                echo "📝 Processing: $draft_file"
                node scripts/convert-draft-to-blog.js "$draft_file"
              fi
            done
            
            echo "processed=true" >> $GITHUB_OUTPUT
          else
            echo "processed=false" >> $GITHUB_OUTPUT
            echo "⚠️ No draft content found"
          fi

      - name: 🔄 Update Blog Data
        run: |
          # 실제 blog-data.ts 업데이트 로직
          node scripts/update-blog-data.js

          git add lib/blog-data.ts
          git config user.name "Blog Auto Publisher"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "📌 No changes to commit"
          else
            git commit -m "🚀 Auto-publish: ${{ needs.check-approval.outputs.publish_type }} content for $(date +%Y-%m-%d)
            
            Published via automated workflow
            Content type: ${{ needs.check-approval.outputs.publish_type }}
            Schedule: $(date +'%A %H:%M')
            
            🤖 Auto-published by GitHub Actions"
            
            git push origin main
          fi

      - name: 🧹 Cleanup Published Content
        run: |
          # 발행된 draft 파일들 정리
          if [[ -d "lib/blog-drafts" ]]; then
            PUBLISHED_DATE=$(date +%Y-%m-%d)
            mkdir -p "lib/blog-archive/$PUBLISHED_DATE"
            mv lib/blog-drafts/* "lib/blog-archive/$PUBLISHED_DATE/" 2>/dev/null || true
            
            git add lib/blog-archive/
            git commit -m "📁 Archive published drafts for $PUBLISHED_DATE" || true
            git push origin main || true
          fi

      - name: 🏷️ Close and Label PR
        if: needs.check-approval.outputs.content_ready == 'true'
        run: |
          PR_NUMBER="${{ needs.check-approval.outputs.pr_number }}"

          # PR 자동 닫기 및 라벨링
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            -d '{"state": "closed"}'
            
          # 발행 완료 라벨 추가
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels" \
            -d '{"labels": ["published", "auto-merged"]}'

      - name: 📢 Send Publication Notification
        run: |
          PUBLISH_TYPE="${{ needs.check-approval.outputs.publish_type }}"
          CURRENT_TIME=$(date +'%Y년 %m월 %d일 %H:%M')

          # 슬랙 알림
          curl -X POST "${{ env.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"🚀 블로그 콘텐츠가 자동 발행되었습니다!\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"🚀 블로그 자동 발행 완료\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*발행 시간*: $CURRENT_TIME\\n*콘텐츠 타입*: $PUBLISH_TYPE\\n*상태*: ✅ 발행 완료\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {
                        \"type\": \"plain_text\",
                        \"text\": \"블로그 확인하기\"
                      },
                      \"url\": \"https://familyoffice-s.vercel.app/blog\",
                      \"style\": \"primary\"
                    }
                  ]
                }
              ]
            }"

      - name: 📊 Publication Summary
        run: |
          echo "## 🚀 블로그 자동 발행 완료!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 발행 정보" >> $GITHUB_STEP_SUMMARY
          echo "- **발행 시간**: $(date +'%Y년 %m월 %d일 %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "- **콘텐츠 타입**: ${{ needs.check-approval.outputs.publish_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **발행 방식**: 자동 스케줄링" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ 완료된 작업" >> $GITHUB_STEP_SUMMARY
          echo "- 승인된 콘텐츠 병합" >> $GITHUB_STEP_SUMMARY
          echo "- 블로그 데이터 업데이트" >> $GITHUB_STEP_SUMMARY
          echo "- Vercel 자동 배포 트리거" >> $GITHUB_STEP_SUMMARY
          echo "- Draft 파일 아카이브" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **블로그 확인**: https://familyoffice-s.vercel.app/blog" >> $GITHUB_STEP_SUMMARY

  notify-skip:
    needs: check-approval
    if: needs.check-approval.outputs.should_publish == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: 📢 Send Skip Notification
        run: |
          REASON="승인되지 않은 콘텐츠 또는 잘못된 스케줄"

          curl -X POST "${{ env.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"⏭️ 블로그 자동 발행이 건너뛰어졌습니다\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*사유*: $REASON\\n*확인 시간*: $(date +'%Y년 %m월 %d일 %H:%M')\\n\\n💡 콘텐츠 검토 후 'ready-to-publish' 라벨을 추가해주세요.\"
                  }
                }
              ]
            }"

      - name: 📊 Skip Summary
        run: |
          echo "## ⏭️ 블로그 발행 건너뜀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 상태 확인" >> $GITHUB_STEP_SUMMARY
          echo "- **승인 상태**: ${{ needs.check-approval.outputs.should_publish }}" >> $GITHUB_STEP_SUMMARY
          echo "- **콘텐츠 준비**: ${{ needs.check-approval.outputs.content_ready }}" >> $GITHUB_STEP_SUMMARY
          echo "- **발행 타입**: ${{ needs.check-approval.outputs.publish_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💡 다음 단계" >> $GITHUB_STEP_SUMMARY
          echo "1. 대기 중인 PR을 검토해주세요" >> $GITHUB_STEP_SUMMARY
          echo "2. 승인 후 'ready-to-publish' 라벨을 추가해주세요" >> $GITHUB_STEP_SUMMARY
          echo "3. 다음 스케줄 시간에 자동 발행됩니다" >> $GITHUB_STEP_SUMMARY
